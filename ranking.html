<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seabass Ranking - BOTTOM FIELD LAB</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html {
      scroll-behavior: smooth;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #0b0c10;
      color: #f0f0f0;
      overflow-x: hidden;
    }
    /* ヘッダー */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background: rgba(11, 12, 16, 0.85);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      z-index: 1000;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .header-title-link {
      text-decoration: none;
      display: flex;
      align-items: center;
    }
    .header-title {
      font-size: 1.1rem;
      font-weight: 800;
      font-style: italic;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffffff 0%, #a855f7 60%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 8px rgba(168, 85, 247, 0.4));
    }
    .back-btn {
      text-decoration: none;
      color: #aaa;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .back-btn:hover {
      color: #fff;
      background: rgba(168, 85, 247, 0.4);
    }

    /* メインコンテナ */
    .container {
      max-width: 800px;
      margin: 80px auto 60px;
      padding: 0 20px;
    }

    .page-title-box {
      text-align: center;
      margin-bottom: 35px;
    }
    .page-title {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 3px;
      background: linear-gradient(135deg, #ffffff, #a855f7, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }
    .page-subtitle {
      font-size: 0.9rem;
      color: #a855f7;
      letter-spacing: 2px;
      margin-top: 4px;
      font-weight: 600;
    }

    /* Top 3 ポディウム（表彰台） */
    .podium-section {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 12px;
      margin-bottom: 40px;
      padding: 20px 10px;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .podium-card {
      flex: 1;
      max-width: 220px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 14px 10px;
      text-align: center;
      position: relative;
      transition: transform 0.3s ease;
      overflow: hidden;
    }
    .podium-card:hover {
      transform: translateY(-4px);
    }
    .podium-card.rank-1 {
      order: 2;
      border-color: rgba(234, 179, 8, 0.6);
      box-shadow: 0 0 20px rgba(234, 179, 8, 0.15);
      transform: translateY(-10px);
    }
    .podium-card.rank-2 {
      order: 1;
      border-color: rgba(203, 213, 225, 0.4);
    }
    .podium-card.rank-3 {
      order: 3;
      border-color: rgba(180, 83, 9, 0.4);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-weight: 800;
      font-size: 0.9rem;
      margin-bottom: 8px;
    }
    .rank-1 .badge { background: linear-gradient(135deg, #fef08a, #ca8a04); color: #000; }
    .rank-2 .badge { background: linear-gradient(135deg, #f1f5f9, #64748b); color: #000; }
    .rank-3 .badge { background: linear-gradient(135deg, #fed7aa, #c2410c); color: #000; }

    .podium-img-wrapper {
      width: 100%;
      height: 90px;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 8px;
      background: #0b0c10;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .podium-img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      display: block;
      transition: transform 0.2s ease;
    }
    .podium-img-wrapper:hover img {
      transform: scale(1.05);
    }
    .podium-img-fallback {
      display: none;
      font-size: 0.75rem;
      color: #64748b;
      font-weight: 600;
    }

    .podium-length {
      font-size: 1.45rem;
      font-weight: 800;
      color: #38bdf8;
      margin: 2px 0;
    }
    .podium-angler {
      font-size: 0.85rem;
      font-weight: 700;
      color: #fff;
    }
    .podium-date {
      font-size: 0.7rem;
      color: #777;
      margin-top: 2px;
    }

    /* ランキングテーブル */
    .table-wrapper {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      overflow: hidden;
      backdrop-filter: blur(5px);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }
    th, td {
      padding: 12px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      vertical-align: middle;
    }
    th {
      background: rgba(255, 255, 255, 0.04);
      color: #888;
      font-weight: 600;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    tr:last-child td {
      border-bottom: none;
    }
    tr:hover {
      background: rgba(255, 255, 255, 0.02);
    }

    /* 順位数字のサイズ拡大調整 */
    .rank-num {
      font-weight: 800;
      font-size: 1.25rem;
      color: #c084fc;
      width: 48px;
      text-align: center;
    }
    .fish-img-cell {
      width: 110px;
    }
    .fish-thumb-wrapper {
      width: 100px;
      height: 55px;
      border-radius: 6px;
      overflow: hidden;
      background: #0b0c10;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .fish-thumb-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      display: block;
      transition: transform 0.2s ease;
    }
    .fish-thumb-wrapper:hover img {
      transform: scale(1.08);
    }
    .thumb-fallback {
      display: none;
      font-size: 0.65rem;
      color: #64748b;
    }

    .length-cell {
      font-weight: 800;
      color: #38bdf8;
      font-size: 1.15rem;
    }
    .angler-cell {
      font-weight: 600;
      color: #fff;
    }
    .date-cell {
      color: #666;
      font-size: 0.75rem;
    }

    @media (max-width: 600px) {
      .podium-section {
        gap: 6px;
        padding: 12px 6px;
      }
      .podium-img-wrapper {
        height: 70px;
      }
      .podium-length {
        font-size: 1.15rem;
      }
      .podium-angler {
        font-size: 0.75rem;
      }
      th, td {
        padding: 10px 6px;
        font-size: 0.8rem;
      }
      .rank-num {
        font-size: 1.1rem;
        width: 38px;
      }
      .fish-img-cell {
        width: 85px;
      }
      .fish-thumb-wrapper {
        width: 80px;
        height: 46px;
      }
      .length-cell {
        font-size: 1.05rem;
      }
    }

    /* 画像拡大モーダル */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      z-index: 2000;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-content-box {
      position: relative;
      max-width: 90vw;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .modal-img {
      max-width: 100%;
      max-height: 75vh;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .modal-caption {
      margin-top: 14px;
      font-size: 1rem;
      font-weight: 700;
      color: #38bdf8;
      text-align: center;
      letter-spacing: 1px;
    }
    .modal-close-btn {
      position: absolute;
      top: -40px;
      right: -10px;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 2rem;
      cursor: pointer;
      line-height: 1;
      opacity: 0.8;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .modal-close-btn:hover {
      opacity: 1;
      transform: scale(1.1);
    }

    /* フッター */
    footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 40px 20px;
      font-size: 0.75rem;
      color: #888;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
    .footer-logo {
      height: 70px !important;
      width: auto !important;
      max-width: 80vw;
      object-fit: contain;
      mix-blend-mode: screen;
      filter: invert(1) brightness(0.7) opacity(0.9);
    }
  </style>
</head>
<body>

  <!-- ヘッダー -->
  <header>
    <a href="index.html" class="header-title-link">
      <span class="header-title">BOTTOM FIELD LAB</span>
    </a>
    <a href="index.html" class="back-btn">
      &larr; Lure Info
    </a>
  </header>

  <!-- メインコンテンツ -->
  <div class="container">
    
    <div class="page-title-box">
      <h1 class="page-title">SEABASS RANKING</h1>
      <p class="page-subtitle">釣果ランキング</p>
    </div>

    <!-- 表彰台 Podiums (Top 3) -->
    <div class="podium-section" id="podium-section">
      <!-- JavaScriptで動的生成 -->
    </div>

    <!-- 全体ランキングテーブル -->
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th style="text-align: center;">#</th>
            <th>画像</th>
            <th>サイズ</th>
            <th>アングラー</th>
            <th>日付</th>
          </tr>
        </thead>
        <tbody id="ranking-tbody">
          <!-- JavaScriptで動的生成 -->
        </tbody>
      </table>
    </div>

  </div>

  <!-- 画像拡大モーダル -->
  <div class="modal-overlay" id="image-modal" onclick="closeModal(event)">
    <div class="modal-content-box">
      <button class="modal-close-btn" onclick="closeModalDirect()">&times;</button>
      <img id="modal-img" class="modal-img" src="" alt="Enlarged Fish Image">
      <div id="modal-caption" class="modal-caption"></div>
    </div>
  </div>

  <footer>
    <img src="logo1.jpg" alt="BOTTOM FIELD LAB Logo" class="footer-logo" onerror="this.src='logo.jpg'; this.onerror=null;">
    <div>&copy; Bottom Field Lab. All Rights Reserved.</div>
  </footer>

  <script>
    // 最新釣果データ
    var rankingData = [
      { rank: 1, length: "64cm", angler: "M.T", date: "2021.02.28", img: "SB01.jpg", altImg: "SB01.JPG" },
      { rank: 2, length: "63cm", angler: "M.T", date: "2026.03.20", img: "SB02.jpg", altImg: "SB02.JPG" },
      { rank: 3, length: "55cm", angler: "M.T", date: "2026.10.11", img: "SB03.jpg", altImg: "SB03.JPG" },
      { rank: 4, length: "55cm", angler: "M.T", date: "2026.05.16", img: "SB04.jpg", altImg: "SB04.JPG" },
      { rank: 5, length: "55cm", angler: "M.T", date: "2026.04.18", img: "SB05.jpg", altImg: "SB05.JPG" },
      { rank: 6, length: "54cm", angler: "Y.I", date: "2021.03.13", img: "SB06.jpg", altImg: "SB06.JPG" },
      { rank: 7, length: "53cm", angler: "M.T", date: "2026.04.18", img: "SB07.jpg", altImg: "SB07.JPG" },
      { rank: 8, length: "46cm", angler: "M.T", date: "2026.04.18", img: "SB08.jpg", altImg: "SB08.JPG" },
      { rank: 9, length: "45cm", angler: "Y.I", date: "2020.11.08", img: "SB09.jpg", altImg: "SB09.JPG" },
      { rank: 10, length: "42cm", angler: "M.T", date: "2026.05.02", img: "SB10.jpg", altImg: "SB10.JPG" }
    ];

    function openModal(imgSrc, captionText) {
      var modal = document.getElementById('image-modal');
      var modalImg = document.getElementById('modal-img');
      var modalCaption = document.getElementById('modal-caption');

      modalImg.src = imgSrc;
      modalCaption.innerText = captionText;
      modal.classList.add('active');
    }

    function closeModal(evt) {
      if (evt.target.classList.contains('modal-overlay')) {
        document.getElementById('image-modal').classList.remove('active');
      }
    }

    function closeModalDirect() {
      document.getElementById('image-modal').classList.remove('active');
    }

    function renderRanking() {
      // 表彰台 (Top 3) の生成
      var podiumEl = document.getElementById('podium-section');
      podiumEl.innerHTML = '';

      var top3 = rankingData.slice(0, 3);
      var rankClasses = ['rank-1', 'rank-2', 'rank-3'];
      var rankBadges = ['1st', '2nd', '3rd'];

      top3.forEach(function(item, idx) {
        var card = document.createElement('div');
        card.className = 'podium-card ' + rankClasses[idx];

        var caption = item.length + ' / ' + item.angler + ' (' + item.date + ')';
        var imgTag = item.img 
          ? '<img src="' + item.img + '" alt="' + item.length + '" onerror="this.onerror=null; if(\'' + item.altImg + '\'){this.src=\'' + item.altImg + '\';}else{this.style.display=\'none\'; this.nextElementSibling.style.display=\'block\';}">' +
            '<div class="podium-img-fallback">NO IMAGE</div>'
          : '<div style="font-size:0.75rem; color:#64748b; font-weight:600;">NO IMAGE</div>';

        card.innerHTML = 
          '<div class="badge">' + rankBadges[idx] + '</div>' +
          '<div class="podium-img-wrapper" onclick="openModal(\'' + item.img + '\', \'' + caption + '\')">' + imgTag + '</div>' +
          '<div class="podium-length">' + item.length + '</div>' +
          '<div class="podium-angler">' + item.angler + '</div>' +
          '<div class="podium-date">' + item.date + '</div>';

        podiumEl.appendChild(card);
      });

      // テーブルリストの生成
      var tbody = document.getElementById('ranking-tbody');
      tbody.innerHTML = '';

      rankingData.forEach(function(item, index) {
        var tr = document.createElement('tr');

        var caption = '#' + (index + 1) + ' ' + item.length + ' / ' + item.angler + ' (' + item.date + ')';
        var thumbTag = item.img 
          ? '<img src="' + item.img + '" alt="' + item.length + '" onerror="this.onerror=null; if(\'' + item.altImg + '\'){this.src=\'' + item.altImg + '\';}else{this.style.display=\'none\'; this.nextElementSibling.style.display=\'block\';}">' +
            '<div class="thumb-fallback">NO IMAGE</div>'
          : '<div style="font-size:0.65rem; color:#64748b;">NO IMAGE</div>';

        tr.innerHTML = 
          '<td class="rank-num">' + (index + 1) + '</td>' +
          '<td class="fish-img-cell"><div class="fish-thumb-wrapper" onclick="openModal(\'' + item.img + '\', \'' + caption + '\')">' + thumbTag + '</div></td>' +
          '<td class="length-cell">' + item.length + '</td>' +
          '<td class="angler-cell">' + item.angler + '</td>' +
          '<td class="date-cell">' + item.date + '</td>';

        tbody.appendChild(tr);
      });
    }

    renderRanking();
  </script>
</body>
</html>

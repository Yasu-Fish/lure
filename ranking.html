<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seabass Ranking - BOTTOM FIELD LAB</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html {
      scroll-behavior: smooth;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #0b0c10;
      color: #f0f0f0;
      overflow-x: hidden;
    }
    /* ヘッダー */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background: rgba(11, 12, 16, 0.85);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      z-index: 1000;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .header-title-link {
      text-decoration: none;
      display: flex;
      align-items: center;
    }
    .header-title {
      font-size: 1.1rem;
      font-weight: 800;
      font-style: italic;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffffff 0%, #a855f7 60%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 8px rgba(168, 85, 247, 0.4));
    }
    .back-btn {
      text-decoration: none;
      color: #aaa;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .back-btn:hover {
      color: #fff;
      background: rgba(168, 85, 247, 0.4);
    }

    /* メインコンテナ */
    .container {
      max-width: 800px;
      margin: 80px auto 60px;
      padding: 0 20px;
    }

    .page-title-box {
      text-align: center;
      margin-bottom: 30px;
    }
    .page-title {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 3px;
      background: linear-gradient(135deg, #ffffff, #a855f7, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }
    .page-subtitle {
      font-size: 0.9rem;
      color: #a855f7;
      letter-spacing: 2px;
      margin-top: 4px;
      font-weight: 600;
    }

    /* 絞り込みタブ */
    .filter-wrapper {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }
    .filter-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #aaa;
      padding: 6px 16px;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .filter-btn:hover, .filter-btn.active {
      color: #fff;
      background: linear-gradient(135deg, #7e22ce, #3b82f6);
      border-color: transparent;
      box-shadow: 0 2px 10px rgba(126, 34, 206, 0.4);
    }

    /* Top 3 ポディウム（表彰台） */
    .podium-section {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 12px;
      margin-bottom: 40px;
      padding: 20px 10px;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .podium-card {
      flex: 1;
      max-width: 200px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 16px 10px;
      text-align: center;
      position: relative;
      transition: transform 0.3s ease;
    }
    .podium-card:hover {
      transform: translateY(-4px);
    }
    .podium-card.rank-1 {
      order: 2;
      border-color: rgba(234, 179, 8, 0.6);
      box-shadow: 0 0 20px rgba(234, 179, 8, 0.15);
      transform: translateY(-10px);
    }
    .podium-card.rank-2 {
      order: 1;
      border-color: rgba(203, 213, 225, 0.4);
    }
    .podium-card.rank-3 {
      order: 3;
      border-color: rgba(180, 83, 9, 0.4);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-weight: 800;
      font-size: 0.9rem;
      margin-bottom: 8px;
    }
    .rank-1 .badge { background: linear-gradient(135deg, #fef08a, #ca8a04); color: #000; }
    .rank-2 .badge { background: linear-gradient(135deg, #f1f5f9, #64748b); color: #000; }
    .rank-3 .badge { background: linear-gradient(135deg, #fed7aa, #c2410c); color: #000; }

    .podium-length {
      font-size: 1.4rem;
      font-weight: 800;
      color: #38bdf8;
      margin: 4px 0;
    }
    .podium-angler {
      font-size: 0.85rem;
      font-weight: 700;
      color: #fff;
    }
    .podium-lure {
      font-size: 0.75rem;
      color: #888;
      margin-top: 2px;
    }

    /* ランキングテーブル */
    .table-wrapper {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      overflow: hidden;
      backdrop-filter: blur(5px);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }
    th, td {
      padding: 14px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    th {
      background: rgba(255, 255, 255, 0.04);
      color: #888;
      font-weight: 600;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    tr:last-child td {
      border-bottom: none;
    }
    tr:hover {
      background: rgba(255, 255, 255, 0.02);
    }

    .rank-num {
      font-weight: 800;
      color: #a855f7;
      width: 40px;
    }
    .length-cell {
      font-weight: 800;
      color: #38bdf8;
      font-size: 1rem;
    }
    .angler-cell {
      font-weight: 600;
      color: #fff;
    }
    .lure-cell {
      color: #aaa;
      font-size: 0.85rem;
    }
    .date-cell {
      color: #666;
      font-size: 0.75rem;
    }

    @media (max-width: 600px) {
      .podium-section {
        gap: 6px;
        padding: 12px 6px;
      }
      .podium-length {
        font-size: 1.1rem;
      }
      .podium-angler {
        font-size: 0.75rem;
      }
      th, td {
        padding: 10px 8px;
        font-size: 0.8rem;
      }
      .length-cell {
        font-size: 0.9rem;
      }
    }

    /* フッター */
    footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 40px 20px;
      font-size: 0.75rem;
      color: #888;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
    .footer-logo {
      height: 70px !important;
      width: auto !important;
      max-width: 80vw;
      object-fit: contain;
      mix-blend-mode: screen;
      filter: invert(1) brightness(0.7) opacity(0.9);
    }
  </style>
</head>
<body>

  <!-- ヘッダー -->
  <header>
    <a href="index.html" class="header-title-link">
      <span class="header-title">BOTTOM FIELD LAB</span>
    </a>
    <a href="index.html" class="back-btn">
      &larr; Lure Info
    </a>
  </header>

  <!-- メインコンテンツ -->
  <div class="container">
    
    <div class="page-title-box">
      <h1 class="page-title">SEABASS RANKING</h1>
      <p class="page-subtitle">釣果ランキング</p>
    </div>

    <!-- ルアー別絞り込みタブ -->
    <div class="filter-wrapper">
      <button class="filter-btn active" onclick="filterRanking('all', event)">ALL</button>
      <button class="filter-btn" onclick="filterRanking('AMY 95 Slim', event)">AMY 95 Slim</button>
      <button class="filter-btn" onclick="filterRanking('AMY 110 Slim', event)">AMY 110 Slim</button>
      <button class="filter-btn" onclick="filterRanking('AMY 72', event)">AMY 72</button>
      <button class="filter-btn" onclick="filterRanking('LUKIA 60', event)">LUKIA 60</button>
    </div>

    <!-- 表彰台 Podiums (Top 3) -->
    <div class="podium-section" id="podium-section">
      <!-- JavaScriptで動的更新 -->
    </div>

    <!-- 全体ランキングテーブル -->
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>サイズ</th>
            <th>アングラー</th>
            <th>使用ルアー</th>
            <th>日付</th>
          </tr>
        </thead>
        <tbody id="ranking-tbody">
          <!-- JavaScriptで動的更新 -->
        </tbody>
      </table>
    </div>

  </div>

  <footer>
    <img src="logo1.jpg" alt="BOTTOM FIELD LAB Logo" class="footer-logo" onerror="this.src='logo.jpg'; this.onerror=null;">
    <div>&copy; Bottom Field Lab. All Rights Reserved.</div>
  </footer>

  <script>
    // サンプル釣果データ（※ここを編集または後日データベース連携可能）
    var rankingData = [
      { rank: 1, length: "92.5cm", angler: "深田 薫人", lure: "AMY 95 Slim", date: "2026.06.29" },
      { rank: 2, length: "88.0cm", angler: "深田 薫人", lure: "AMY 95 Slim", date: "2026.06.29" },
      { rank: 3, length: "88.0cm", angler: "山川 橘愛", lure: "AMY 110 Slim", date: "2026.06.20" },
      { rank: 4, length: "85.2cm", angler: "海老根 蓮太", lure: "AMY 95 Slim", date: "2026.05.14" },
      { rank: 5, length: "82.0cm", angler: "深川 樟名", lure: "LUKIA 60", date: "2026.04.18" },
      { rank: 6, length: "79.5cm", angler: "海老根 蓮太", lure: "AMY 72", date: "2026.03.10" },
      { rank: 7, length: "74.5cm", angler: "深川 樟名", lure: "AMY 95 Slim", date: "2026.02.28" }
    ];

    function renderRanking(filterLure) {
      var filtered = rankingData;
      if (filterLure && filterLure !== 'all') {
        filtered = rankingData.filter(function(item) {
          return item.lure === filterLure;
        });
      }

      // 表彰台 (Top 3) の更新
      var podiumEl = document.getElementById('podium-section');
      podiumEl.innerHTML = '';

      var top3 = filtered.slice(0, 3);
      var rankClasses = ['rank-1', 'rank-2', 'rank-3'];
      var rankBadges = ['1st', '2nd', '3rd'];

      top3.forEach(function(item, idx) {
        var card = document.createElement('div');
        card.className = 'podium-card ' + rankClasses[idx];
        card.innerHTML = 
          '<div class="badge">' + rankBadges[idx] + '</div>' +
          '<div class="podium-length">' + item.length + '</div>' +
          '<div class="podium-angler">' + item.angler + '</div>' +
          '<div class="podium-lure">' + item.lure + '</div>';
        podiumEl.appendChild(card);
      });

      // テーブルリストの更新
      var tbody = document.getElementById('ranking-tbody');
      tbody.innerHTML = '';

      filtered.forEach(function(item, index) {
        var tr = document.createElement('tr');
        tr.innerHTML = 
          '<td class="rank-num">' + (index + 1) + '</td>' +
          '<td class="length-cell">' + item.length + '</td>' +
          '<td class="angler-cell">' + item.angler + '</td>' +
          '<td class="lure-cell">' + item.lure + '</td>' +
          '<td class="date-cell">' + item.date + '</td>';
        tbody.appendChild(tr);
      });
    }

    function filterRanking(lureName, evt) {
      var btns = document.querySelectorAll('.filter-btn');
      btns.forEach(function(btn) { btn.classList.remove('active'); });
      if (evt && evt.target) evt.target.classList.add('active');
      
      renderRanking(lureName);
    }

    // 初期表示
    renderRanking('all');
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lure Information - AMY & LUKIA</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html {
      scroll-behavior: smooth;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #0b0c10;
      color: #f0f0f0;
      overflow-x: hidden;
    }
    /* ヘッダー */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background: rgba(11, 12, 16, 0.85);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      z-index: 1000;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* ヘッダー左側：Lure Information テキストロゴ (最適サイズ＋スタイリッシュな斜体) */
    .header-title-link {
      text-decoration: none;
      display: flex;
      align-items: center;
    }
    .header-title {
      font-size: 1.2rem;
      font-weight: 800;
      font-style: italic;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffffff 0%, #a855f7 60%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 8px rgba(168, 85, 247, 0.4));
      transition: transform 0.3s ease, filter 0.3s ease;
    }
    .header-title-link:hover .header-title {
      transform: scale(1.03);
      filter: drop-shadow(0 0 14px rgba(34, 211, 238, 0.8));
    }

    @media (max-width: 768px) {
      header {
        padding: 0 16px;
      }
      .header-title {
        font-size: 1.0rem;
        letter-spacing: 1px;
      }
    }

    /* 切り替えタブ */
    .tab-switcher {
      display: flex;
      background: rgba(255, 255, 255, 0.1);
      padding: 4px;
      border-radius: 20px;
    }
    .tab-btn {
      border: none;
      background: transparent;
      color: #aaa;
      padding: 6px 16px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .tab-btn.active {
      color: #fff;
      background: linear-gradient(135deg, #7e22ce, #3b82f6);
      box-shadow: 0 2px 10px rgba(126, 34, 206, 0.5);
    }

    /* ヒーローポスター */
    .hero-container {
      position: relative;
      width: 100%;
      height: calc(100vh - 60px);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 0;
    }
    .main-hero {
      margin-top: 60px;
    }
    .sub-hero {
      margin-top: 40px;
    }
    .hero-bg {
      width: 100%;
      max-width: 100%;
      height: auto;
      max-height: 92vh;
      object-fit: contain;
      object-position: center;
      transition: opacity 0.3s ease;
    }

    /* 拡大画像の上に表示されるルアー名ラベル（PC表示調整） */
    .hero-lure-title {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 4px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffffff, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
      z-index: 20;
      pointer-events: none;
      white-space: nowrap;
      transition: opacity 0.3s ease;
      display: none;
      opacity: 0;
    }

    /* スマホ画面向けの表示位置調整 */
    @media (max-width: 768px) {
      .hero-lure-title {
        font-size: 1.5rem;
        top: 28%;
        letter-spacing: 2px;
      }
    }

    /* スクロール誘導アイコン */
    .scroll-indicator {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: rgba(255, 255, 255, 0.8);
      font-size: 0.75rem;
      letter-spacing: 1px;
      animation: bounce 2s infinite;
      z-index: 10;
      text-transform: uppercase;
    }
    .scroll-indicator svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }
    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translate(-50%, 0); }
      40% { transform: translate(-50%, -10px); }
      60% { transform: translate(-50%, -5px); }
    }

    /* コンテンツエリア */
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 40px 20px 60px;
    }
    .section-title {
      font-size: 1.4rem;
      text-align: center;
      margin-bottom: 24px;
      letter-spacing: 2px;
      position: relative;
    }
    .section-title::after {
      content: '';
      display: block;
      width: 40px;
      height: 2px;
      background: #a855f7;
      margin: 8px auto 0;
      border-radius: 2px;
    }

    /* スペック表 */
    .spec-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 40px;
      backdrop-filter: blur(5px);
    }
    .spec-row {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.95rem;
    }
    .spec-row:last-child {
      border-bottom: none;
    }
    .spec-label {
      color: #888;
    }
    .spec-value {
      font-weight: 600;
      color: #fff;
    }

    /* カラーバリエーション */
    .color-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-bottom: 40px;
    }
    .color-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .color-card:hover {
      transform: translateY(-4px);
      border-color: #a855f7;
      box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3);
    }
    .color-swatch {
      width: 100%;
      height: 120px;
      border-radius: 8px;
      margin-bottom: 10px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #0b0c10;
      position: relative;
    }
    /* 通常 AMY / LUKIA */
    .color-swatch img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      border-radius: 8px;
      display: block;
    }
    /* AMY Slim 専用 */
    .color-swatch img.slim-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    /* Coming Soon 専用のおしゃれなスウォッチデザイン */
    .coming-soon-box {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, rgba(255,255,255,0.06), rgba(168,85,247,0.15));
      border: 1px dashed rgba(255, 255, 255, 0.25);
      border-radius: 8px;
      color: #e2e8f0;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
    }
    .coming-soon-box .cs-text {
      font-size: 0.85rem;
      background: linear-gradient(135deg, #ffffff, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 2px;
    }
    .coming-soon-box .cs-sub {
      font-size: 0.65rem;
      color: #94a3b8;
      letter-spacing: 1px;
    }

    .color-fallback-box {
      display: none;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 600;
      color: #fff;
      border-radius: 8px;
    }
    .color-name {
      font-size: 0.85rem;
      font-weight: 600;
    }

    /* フッターおよびロゴ設定 */
    footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 40px 20px;
      font-size: 0.75rem;
      color: #888;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
    .footer-logo {
      height: 70px !important;
      width: auto !important;
      max-width: 80vw;
      object-fit: contain;
      mix-blend-mode: screen;
      filter: invert(1) brightness(0.7) opacity(0.9);
      transition: opacity 0.3s ease;
    }
    .footer-logo:hover {
      opacity: 1;
    }

    /* SNS アイコンリンクスタイル */
    .social-links {
      display: flex;
      gap: 24px;
      align-items: center;
      margin-top: 4px;
    }
    .social-icon {
      color: #aaa;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.3s ease, transform 0.3s ease;
    }
    .social-icon svg {
      width: 100%;
      height: 100%;
      fill: currentColor;
    }
    .social-icon.instagram:hover {
      color: #e1306c;
      transform: translateY(-3px) scale(1.08);
    }
    .social-icon.youtube:hover {
      color: #ff0000;
      transform: translateY(-3px) scale(1.08);
    }
    .social-icon.x-twitter:hover {
      color: #ffffff;
      transform: translateY(-3px) scale(1.08);
    }
    @media (max-width: 768px) {
      .social-icon {
        width: 30px;
        height: 30px;
      }
    }
  </style>
</head>

  <script>
    var brandData = {
      amy: {
        imgSrc: 'AMY_3.jpg',
        title: 'AMY',
        displayTitle: 'AMY 72',
        catch: 'ナチュラルな微弱波動でターゲットを狙い打つエイミー',
        length: '72mm',
        weight: '8.0g',
        type: 'シンキングペンシル',
        hook: '#8',
        fallbackBg: 'radial-gradient(circle, #2e1065 0%, #0b0c10 100%)',
        fallbackColor: '#e9d5ff',
        colors: [
          { name: 'アーバングリーン', img: 'AMY_color1.jpg', detailImg: 'AMY_color1.jpg', bg: 'linear-gradient(135deg, #22c55e, #15803d)' },
          { name: 'ブラックプラム', img: 'AMY_color2.jpg', detailImg: 'AMY_color2.jpg', bg: 'linear-gradient(135deg, #18181b, #3f3f46)' },
          { name: 'クリアパープル', img: 'AMY_color3.jpg', detailImg: 'AMY_color3.jpg', bg: 'linear-gradient(135deg, #a855f7, #6b21a8)' },
          { name: 'レッドアイグロー', img: 'AMY_color4.jpg', detailImg: 'AMY_color4_large.jpg', bg: 'linear-gradient(135deg, #ef4444, #991b1b)' }
        ],
        slimColors: [
          { name: 'アーバングリーン', img: 'AMY_Slim_c1.JPG', altImg: 'AMY_Slim_c1.jpg', bg: 'linear-gradient(135deg, #22c55e, #15803d)' },
          { name: 'クリアピンク', img: 'AMY_Slim_c2.JPG', altImg: 'AMY_Slim_c2.jpg', bg: 'linear-gradient(135deg, #ec4899, #be185d)' }
        ]
      },
      lukia: {
        imgSrc: 'LUKIA_3.jpg',
        title: 'LUKIA',
        displayTitle: 'LUKIA 60',
        catch: '都会の明暗に潜む一筋の光',
        length: '60mm',
        weight: '9.1g',
        type: 'シンキングバイブ',
        hook: '#8',
        fallbackBg: 'radial-gradient(circle, #064e3b 0%, #0b0c10 100%)',
        fallbackColor: '#6ee7b7',
        colors: [
          { name: 'アーバングリーン', img: 'LUKIA_color1.jpg', detailImg: 'LUKIA_color1.jpg', bg: 'linear-gradient(135deg, #22c55e, #15803d)' },
          { name: 'ブラックプラム', img: 'LUKIA_color2.jpg', detailImg: 'LUKIA_color2.jpg', bg: 'linear-gradient(135deg, #18181b, #3f3f46)' },
          { name: 'トワイライト', img: 'LUKIA_color3.jpg', detailImg: 'LUKIA_color3.jpg', bg: 'linear-gradient(135deg, #eab308, #854d0e)' },
          { name: 'レッドアイグロー', img: 'LUKIA_color4.jpg', detailImg: 'LUKIA_color4.jpg', bg: 'linear-gradient(135deg, #ef4444, #991b1b)' },
          { name: 'スマイルイエロー', img: 'LUKIA_color5.jpg', detailImg: 'LUKIA_color5.jpg', bg: 'linear-gradient(135deg, #facc15, #ca8a04)' },
          { name: 'ミルキー', isComingSoon: true }
        ]
      }
    };

    function switchBrand(brandKey, evt) {
      var data = brandData[brandKey];
      if (!data) return;
      
      var btns = document.querySelectorAll('.tab-btn');
      for (var i = 0; i < btns.length; i++) {
        btns[i].classList.remove('active');
      }

      if (evt && evt.target) {
        evt.target.classList.add('active');
      } else {
        var activeBtn = document.getElementById('btn-' + brandKey);
        if (activeBtn) activeBtn.classList.add('active');
      }

      changeMainImage(data.imgSrc, null);

      var fallback = document.getElementById('hero-fallback');
      if (fallback) {
        fallback.style.display = 'none';
        fallback.style.background = data.fallbackBg;
      }
      
      document.getElementById('fallback-title').innerText = data.title;
      document.getElementById('fallback-title').style.color = data.fallbackColor;
      document.getElementById('fallback-catch').innerText = data.catch;

      document.getElementById('main-spec-title').innerText = data.title + ' SPECIFICATION';
      document.getElementById('main-color-title').innerText = data.title + ' COLOR VARIATION';

      document.getElementById('spec-length').innerText = data.length;
      document.getElementById('spec-weight').innerText = data.weight;
      document.getElementById('spec-type').innerText = data.type;
      document.getElementById('spec-hook').innerText = data.hook;

      var colorGrid = document.getElementById('color-grid');
      colorGrid.innerHTML = '';
      
      for (var j = 0; j < data.colors.length; j++) {
        (function(col) {
          var card = document.createElement('div');
          card.className = 'color-card';
          
          if (col.isComingSoon) {
            card.onclick = function() { showComingSoonHero(col.name, data.displayTitle); };
            card.innerHTML = 
              '<div class="color-swatch">' +
                '<div class="coming-soon-box">' +
                  '<span class="cs-text">Coming Soon</span>' +
                  '<span class="cs-sub">NEW COLOR</span>' +
                '</div>' +
              '</div>' +
              '<div class="color-name">' + col.name + '</div>';
          } else {
            var targetImage = col.detailImg || col.img;
            card.onclick = function() { selectColor(targetImage, data.displayTitle); };
            
            card.innerHTML = 
              '<div class="color-swatch">' +
                '<img src="' + col.img + '" alt="' + col.name + '" onerror="this.style.display=\'none\'; this.nextElementSibling.style.display=\'flex\';">' +
                '<div class="color-fallback-box" style="background:' + col.bg + ';">' + col.name + '</div>' +
              '</div>' +
              '<div class="color-name">' + col.name + '</div>';
          }
          
          colorGrid.appendChild(card);
        })(data.colors[j]);
      }

      // AMY Slim セクション制御
      var slimWrapper = document.getElementById('amy-slim-wrapper');
      if (brandKey === 'amy' && data.slimColors) {
        slimWrapper.style.display = 'block';
        var slimGrid = document.getElementById('amy-slim-color-grid');
        slimGrid.innerHTML = '';

        for (var k = 0; k < data.slimColors.length; k++) {
          (function(col) {
            var card = document.createElement('div');
            card.className = 'color-card';
            
            card.onclick = function() { selectColor(col.img, 'AMY 95 Slim'); };
            
            card.innerHTML = 
              '<div class="color-swatch">' +
                '<img src="' + col.img + '" class="slim-img" alt="' + col.name + '" onerror="this.onerror=null; if(\''+col.altImg+'\'){this.src=\''+col.altImg+'\';} else {this.style.display=\'none\'; this.nextElementSibling.style.display=\'flex\';}">' +
                '<div class="color-fallback-box" style="background:' + col.bg + ';">' + col.name + '</div>' +
              '</div>' +
              '<div class="color-name">' + col.name + '</div>';
            
            slimGrid.appendChild(card);
          })(data.slimColors[k]);
        }
      } else {
        slimWrapper.style.display = 'none';
      }
    }

    function showComingSoonHero(colorName, lureLabel) {
      var heroImg = document.getElementById('hero-img');
      var fallback = document.getElementById('hero-fallback');
      var lureTitle = document.getElementById('hero-lure-title');

      if (heroImg) heroImg.style.display = 'none';

      if (fallback) {
        fallback.style.background = 'radial-gradient(circle, #2e1065 0%, #0b0c10 100%)';
        document.getElementById('fallback-title').innerText = lureLabel + ' - ' + colorName;
        document.getElementById('fallback-title').style.color = '#e9d5ff';
        document.getElementById('fallback-catch').innerText = 'COMING SOON...';
        fallback.style.display = 'flex';
      }

      if (lureTitle) lureTitle.style.display = 'none';

      document.documentElement.scrollTop = 0;
      document.body.scrollTop = 0;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function selectColor(imageSrc, lureLabel) {
      changeMainImage(imageSrc, lureLabel);
      
      document.documentElement.scrollTop = 0;
      document.body.scrollTop = 0;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function changeMainImage(imageSrc, lureLabel) {
      var heroImg = document.getElementById('hero-img');
      var lureTitle = document.getElementById('hero-lure-title');
      if (!heroImg) return;
      
      heroImg.setAttribute('data-alt-tried', 'false');
      heroImg.style.opacity = '0';
      
      if (lureTitle) {
        lureTitle.style.opacity = '0';
      }

      setTimeout(function() {
        heroImg.src = imageSrc;
        heroImg.style.display = 'block';
        heroImg.style.opacity = '1';

        if (lureTitle) {
          if (lureLabel) {
            lureTitle.innerText = lureLabel;
            lureTitle.style.display = 'block';
            setTimeout(function() { lureTitle.style.opacity = '1'; }, 50);
          } else {
            lureTitle.style.display = 'none';
          }
        }
      }, 150);
    }

    function handleMainImgError(img) {
      var tried = img.getAttribute('data-alt-tried');
      if (tried !== 'true') {
        img.setAttribute('data-alt-tried', 'true');
        if (img.src.indexOf('.JPG') !== -1) {
          img.src = img.src.replace('.JPG', '.jpg');
          return;
        } else if (img.src.indexOf('.jpg') !== -1) {
          img.src = img.src.replace('.jpg', '.JPG');
          return;
        }
      }
      img.style.display = 'none';
      var fallback = document.getElementById('hero-fallback');
      if (fallback) fallback.style.display = 'flex';
    }

    function init() {
      switchBrand('lukia', null);
    }

    if (document.readyState === 'interactive' || document.readyState === 'complete') {
      init();
    } else {
      document.addEventListener('DOMContentLoaded', init);
    }
  </script>
</body>
</html>

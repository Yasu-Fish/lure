<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ルアー紹介</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }
    /* ページの最上部にあるメニューリンクの見た目 */
    .nav {
      margin-bottom: 30px;
      padding: 10px;
      background-color: #f0f0f0;
      border-radius: 5px;
    }
    .nav a {
      margin-right: 20px;
      font-size: 18px;
      font-weight: bold;
      color: #0066cc;
      text-decoration: none;
    }
    .nav a:hover {
      text-decoration: underline;
    }
    /* 各ルアーのセクション */
    .lure-section {
      margin-bottom: 50px;
    }
    /* 画像を画面幅の50%にし、小さく綺麗に収める設定 */
    img {
      max-width: 50%;
      height: auto;
      display: block;
      margin: 10px 0;
    }
  </style>
</head>
<body>

  <h1>ルアー紹介</h1>

  <!-- ページ上部のクリック用メニュー -->
  <div class="nav">
    <a href="#amy">AMY</a>
    <a href="#lukia">LUKIA</a>
  </div>

  <!-- AMYのセクション -->
  <div id="amy" class="lure-section">
    <h2>AMY</h2>
    <img src="AMY_3.jpg" alt="AMY">
  </div>

  <!-- LUKIAのセクション -->
  <div id="lukia" class="lure-section">
    <h2>LUKIA</h2>
    <img src="LUKIA_3.jpg" alt="LUKIA">
  </div>

</body>
</html>

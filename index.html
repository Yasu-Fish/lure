<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ルアー紹介</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }
    .nav {
      margin-bottom: 30px;
      padding: 10px;
      background-color: #f0f0f0;
      border-radius: 5px;
    }
    .nav a {
      margin-right: 20px;
      font-size: 18px;
      font-weight: bold;
      color: #0066cc;
      text-decoration: none;
    }
    .nav a:hover {
      text-decoration: underline;
    }
    .lure-section {
      margin-bottom: 50px;
    }
    /* 画像を画面幅の40%にして少し小さめに収める設定 */
    img {
      max-width: 40%;
      height: auto;
      display: block;
      margin: 10px 0;
    }
  </style>
</head>
<body>

  <h1>ルアー紹介</h1>

  <!-- 上部メニュー -->
  <div class="nav">
    <a href="#amy">AMY</a>
    <a href="#lukia">LUKIA</a>
  </div>

  <!-- AMY（LUKIA_3.jpg がAMYの画像データのため指定） -->
  <div id="amy" class="lure-section">
    <h2>AMY</h2>
    <img src="LUKIA_3.jpg" alt="AMY">
  </div>

  <!-- LUKIA（AMY_3.jpg がLUKIAの画像データのため指定） -->
  <div id="lukia" class="lure-section">
    <h2>LUKIA</h2>
    <img src="AMY_3.jpg" alt="LUKIA">
  </div>

</body>
</html>

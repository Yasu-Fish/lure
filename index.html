<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ルアー紹介</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    h1 {
      border-bottom: 3px solid #0066cc;
      padding-bottom: 10px;
      color: #0066cc;
      text-align: center;
    }
    .lure-card {
      background: #ffffff;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 30px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      text-align: center;
    }
    .lure-card h2 {
      color: #222;
      border-left: 4px solid #0066cc;
      padding-left: 10px;
      text-align: left;
    }
    /* 画像を少し小さく（70%）し、中央に綺麗に表示 */
    img {
      max-width: 70%;
      height: auto;
      border-radius: 6px;
      display: block;
      margin: 15px auto;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>ルアー紹介</h1>

    <!-- AMYのカード（緑色のルアー画像が入ったファイル名を指定） -->
    <div class="lure-card">
      <h2>AMY</h2>
      <img src="LUKIA_3.jpg" alt="AMY">
    </div>

    <!-- LUKIAのカード（もう一方のルアー画像が入ったファイル名を指定） -->
    <div class="lure-card">
      <h2>LUKIA</h2>
      <img src="AMY_3.jpg" alt="LUKIA">
    </div>
  </div>

</body>
</html>

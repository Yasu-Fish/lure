<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lure Information - AMY & LUKIA</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html {
      scroll-behavior: smooth;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #0b0c10;
      color: #f0f0f0;
      overflow-x: hidden;
    }
    /* ヘッダー */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background: rgba(11, 12, 16, 0.85);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      z-index: 1000;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    /* ロゴ（ヘッダー枠内にすっきり収まる安全な固定サイズ） */
    .brand-logo-container {
      display: flex;
      align-items: center;
      height: 100%;
    }
    .brand-logo-img {
      height: 28px; /* ヘッダー内に余裕をもって収まる高さ */
      width: auto;
      max-width: 100px;
      object-fit: contain;
      /* 白背景を自動透過して綺麗な色合いで表示 */
      mix-blend-mode: screen;
      filter: invert(1) hue-rotate(220deg) brightness(1.8) contrast(1.2) drop-shadow(0 0 5px rgba(168, 85, 247, 0.8));
    }

    /* スマホ画面での表示（PC同様に小さく固定） */
    @media (max-width: 768px) {
      header {
        padding: 0 12px;
      }
      .brand-logo-img {
        height: 24px;
        max-width: 80px;
      }
    }

    /* 切り替えタブ */
    .tab-switcher {
      display: flex;
      background: rgba(255, 255, 255, 0.1);
      padding: 4px;
      border-radius: 20px;
    }
    .tab-btn {
      border: none;
      background: transparent;
      color: #aaa;
      padding: 6px 16px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .tab-btn.active {
      color: #fff;
      background: linear-gradient(135deg, #7e22ce, #3b82f6);
      box-shadow: 0 2px 10px rgba(126, 34, 206, 0.5);
    }

    /* ヒーローポスター */
    .hero-container {
      position: relative;
      width: 100%;
      height: calc(100vh - 60px);
      margin-top: 60px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 0;
    }
    .hero-bg {
      width: 100%;
      max-width: 100%;
      height: auto;
      max-height: 92vh;
      object-fit: contain;
      object-position: center;
      transition: opacity 0.3s ease;
    }

    /* スクロール誘導アイコン */
    .scroll-indicator {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: rgba(255, 255, 255, 0.8);
      font-size: 0.75rem;
      letter-spacing: 1px;
      animation: bounce 2s infinite;
      z-index: 10;
      text-transform: uppercase;
    }
    .scroll-indicator svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }
    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translate(-50%, 0); }
      40% { transform: translate(-50%, -10px); }
      60% { transform: translate(-50%, -5px); }
    }

    /* コンテンツエリア */
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }
    .section-title {
      font-size: 1.4rem;
      text-align: center;
      margin-bottom: 24px;
      letter-spacing: 2px;
      position: relative;
    }
    .section-title::after {
      content: '';
      display: block;
      width: 40px;
      height: 2px;
      background: #a855f7;
      margin: 8px auto 0;
      border-radius: 2px;
    }

    /* スペック表 */
    .spec-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 40px;
      backdrop-filter: blur(5px);
    }
    .spec-row {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.95rem;
    }
    .spec-row:last-child {
      border-bottom: none;
    }
    .spec-label {
      color: #888;
    }
    .spec-value {
      font-weight: 600;
      color: #fff;
    }

    /* カラーバリエーション */
    .color-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-bottom: 40px;
    }

      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius

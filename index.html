<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lure Information - AMY & LUKIA</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html {
      scroll-behavior: smooth;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #0b0c10;
      color: #f0f0f0;
      overflow-x: hidden;
    }
    /* ヘッダー */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background: rgba(11, 12, 16, 0.85);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      z-index: 1000;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    /* 魚の形だけをくり抜いて綺麗なグラデーション表示にする設定 */
    .brand-logo-container {
      display: flex;
      align-items: center;
      height: 100%;
    }
    .brand-logo-mask {
      width: 110px;
      height: 38px;
      background: linear-gradient(135deg, #a855f7, #22d3ee);
      -webkit-mask-image: url('logo.jpg');
      mask-image: url('logo.jpg');
      -webkit-mask-size: contain;
      mask-size: contain;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-position: center;
      mask-position: center;
      filter: drop-shadow(0 0 6px rgba(34, 211, 238, 0.6));
      mix-blend-mode: screen;
    }

    /* 切り替えタブ */
    .tab-switcher {
      display: flex;
      background: rgba(255, 255, 255, 0.1);
      padding: 4px;
      border-radius: 20px;
    }
    .tab-btn {
      border: none;
      background: transparent;
      color: #aaa;
      padding: 6px 16px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .tab-btn.active {
      color: #fff;
      background: linear-gradient(135deg, #7e22ce, #3b82f6);
      box-shadow: 0 2px 10px rgba(126, 34, 206, 0.5);
    }

    /* ヒーローポスター */
    .hero-container {
      position: relative;
      width: 100%;
      height: calc(100vh - 60px);
      margin-top: 60px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 0;
    }
    .hero-bg {
      width: 100%;
      max-width: 100%;
      height: auto;
      max-height: 92vh;
      object-fit: contain;
      object-position: center;
      transition: opacity 0.3s ease;
    }

    /* スクロール誘導アイコン */
    .scroll-indicator {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: rgba(255, 255, 255, 0.8);
      font-size: 0.75rem;
      letter-spacing: 1px;
      animation: bounce 2s infinite;
      z-index: 10;
      text-transform: uppercase;
    }
    .scroll-indicator svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }
    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translate(-50%, 0); }
      40% { transform: translate(-50%, -10px); }
      60% { transform: translate(-50%, -5px); }
    }

    /* コンテンツエリア */
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }
    .section-title {
      font-size: 1.4rem;
      text-align: center;
      margin-bottom: 24px;
      letter-spacing: 2px;
      position: relative;
    }
    .section-title::after {
      content: '';
      display: block;
      width: 40px;
      height: 2px;
      background: #a855f7;
      margin: 8px auto 0;
      border-radius: 2px;
    }

    /* スペック表 */
    .spec-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 40px;
      backdrop-filter: blur(5px);
    }
    .spec-row {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.95rem;
    }
    .spec-row:last-child {
      border-bottom: none;
    }
    .spec-label {
      color: #888;
    }
    .spec-value {
      font-weight: 600;
      color: #fff;
    }

    /* カラーバリエーション */
    .color-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-bottom: 40px;
    }
    .color-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .color-card:hover {
      transform: translateY(-4px);
      border-color: #a855f7;
      box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3);
    }
    .color-swatch {
      width: 100%;
      height: 120px;
      border-radius: 8px;
      margin-bottom: 10px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #1a1d24;
    }
    .color-swatch img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      border-radius: 8px;
      display: block;
    }
    .color-name {
      font-size: 0.85rem;
      font-weight: 600;
    }

    /* フッター */
    footer {
      text-align: center;
      padding: 20px;
      font-size: 0.75rem;
      color: #555;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body>

  <!-- ヘッダー -->
  <header>
    <!-- 左上くり抜きロゴ -->
    <div class="brand-logo-container">
      <div class="brand-logo-mask" title="BFL Logo"></div>
    </div>

    <div class="tab-switcher">
      <button class="tab-btn" id="btn-amy" onclick="switchBrand('amy', event)">AMY</button>
      <button class="tab-btn" id="btn-lukia" onclick="switchBrand('lukia', event)">LUKIA</button>
    </div>
  </header>

  <!-- 全画面ポスターヒーロー -->
  <div class="hero-container" id="hero-section">
    <img id="hero-img" class="hero-bg" src="LUKIA_3.jpg" alt="Lure Poster" onerror="this.style.display='none'; document.getElementById('hero-fallback').style.display='flex';">
    
    <div id="hero-fallback" class="hero-bg" style="display:none; flex-direction:column; justify-content:center; align-items:center; background: radial-gradient(circle, #064e3b 0%, #0b0c10 100%); text-align:center; padding:20px;">
      <h1 id="fallback-title" style="font-size: 3rem; letter-spacing:4px; margin-bottom:10px; background: linear-gradient(135deg, #6ee7b7, #3b82f6); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">LUKIA</h1>
      <p id="fallback-catch" style="font-size: 1rem; color:#6ee7b7;">都会の明暗に潜む一筋の光</p>
    </div>

    <div class="scroll-indicator">
      <span>SCROLL FOR DETAILS</span>
      <svg viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>
    </div>
  </div>

  <!-- コンテンツ詳細 -->
  <div class="container">
    
    <!-- スペック紹介 -->
    <h2 class="section-title">SPECIFICATION</h2>
    <div class="spec-card">
      <div class="spec-row">
        <span class="spec-label">Length</span>
        <span class="spec-value" id="spec-length">60mm</span>
      </div>
      <div class="spec-row">
        <span class="spec-label">Weight</span>
        <span class="spec-value" id="spec-weight">9.1g</span>
      </div>
      <div class="spec-row">
        <span class="spec-label">Type</span>
        <span class="spec-value" id="spec-type">シンキングバイブ</span>
      </div>
      <div class="spec-row">
        <span class="spec-label">Hook</span>
        <span class="spec-value" id="spec-hook">#8</span>
      </div>
    </div>

    <!-- カラーバリエーション -->
    <h2 class="section-title">COLOR VARIATION</h2>
    <div class="color-grid" id="color-grid">
      <!-- JavaScriptで動的生成 -->
    </div>

  </div>

  <footer>
    &copy; 2026 BFL. All Rights Reserved.
  </footer>

  <script>
    const brandData = {
      amy: {
        imgSrc: 'AMY_3.jpg',
        title: 'AMY',
        catch: 'ナチュラルな微弱波動でターゲットを狙い打つエイミー',
        length: '72mm',
        weight: '8.0g',
        type: 'シンキングペンシル',
        hook: '#8',
        fallbackBg: 'radial-gradient(circle, #2e1065 0%, #0b0c10 100%)',
        fallbackColor: '#e9d5ff',
        colors: [
          { name: 'アーバングリーン', img: 'AMY_color1.jpg', detailImg: 'AMY_color1.jpg', bg: 'linear-gradient(135deg, #7e22ce, #c084fc)' },
          { name: 'ブラックプラム', img: 'AMY_color2.jpg', detailImg: 'AMY_color2.jpg', bg: 'linear-gradient(135deg, #ec4899, #fbcfe8)' },
          { name: 'クリアパープル', img: 'AMY_color3.jpg', detailImg: 'AMY_color3.jpg', bg: 'linear-gradient(135deg, #2563eb, #93c5fd)' },
          { name: 'レッドアイグロー', img: 'AMY_color4.jpg', detailImg: 'AMY_color4.jpg', bg: 'linear-gradient(135deg, #eab308, #fef08a)' }
        ]
      },
      lukia: {
        imgSrc: 'LUKIA_3.jpg',
        title: 'LUKIA',
        catch: '都会の明暗に潜む一筋の光',
        length: '60mm',
        weight: '9.1g',
        type: 'シンキングバイブ',
        hook: '#8',
        fallbackBg: 'radial-gradient(circle, #064e3b 0%, #0b0c10 100%)',
        fallbackColor: '#6ee7b7',
        colors: [
          { name: 'アーバングリーン', img: 'LUKIA_color1.jpg', detailImg: 'LUKIA_color1.jpg', bg: 'linear-gradient(135deg, #22c55e, #86efac)' },
          { name: 'ブラックプラム', img: 'LUKIA_color2.jpg', detailImg: 'LUKIA_color2.jpg', bg: 'linear-gradient(135deg, #18181b, #52525b)' },
          { name: 'クリアイエロー', img: 'LUKIA_color3.jpg', detailImg: 'LUKIA_color3.jpg', bg: 'linear-gradient(135deg, #84cc16, #d9f99d)' },
          { name: 'レッドアイグロー', img: 'LUKIA_color4.jpg', detailImg: 'LUKIA_color4.jpg', bg: 'linear-gradient(135deg, #e2e8f0, #ffffff)' }
        ]
      }
    };

    function switchBrand(brandKey, evt) {
      const data = brandData[brandKey];
      
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (evt && evt.target) {
        evt.target.classList.add('active');
      } else {
        const activeBtn = document.getElementById(`btn-${brandKey}`);
        if (activeBtn) activeBtn.classList.add('active');
      }

      changeMainImage(data.imgSrc);

      const fallback = document.getElementById('hero-fallback');
      fallback.style.display = 'none';
      fallback.style.background = data.fallbackBg;
      document.getElementById('fallback-title').innerText = data.title;
      document.getElementById('fallback-title').style.color = data.fallbackColor;
      document.getElementById('fallback-catch').innerText = data.catch;

      document.getElementById('spec-length').innerText = data.length;
      document.getElementById('spec-weight').innerText = data.weight;
      document.getElementById('spec-type').innerText = data.type;
      document.getElementById('spec-hook').innerText = data.hook;

      const colorGrid = document.getElementById('color-grid');
      colorGrid.innerHTML = '';
      data.colors.forEach(col => {
        const card = document.createElement('div');
        card.className = 'color-card';
        const targetImage = col.detailImg || col.img;
        card.onclick = () => selectColor(targetImage);
        
        card.innerHTML = `
          <div class="color-swatch">
            <img src="${col.img}" alt="${col.name}" onerror="this.style.display='none';">
          </div>
          <div class="color-name">${col.name}</div>
        `;
        colorGrid.appendChild(card);
      });
    }

    function selectColor(imageSrc) {
      changeMainImage(imageSrc);
      document.getElementById('hero-section').scrollIntoView({ behavior: 'smooth' });
    }

    function changeMainImage(imageSrc) {
      const heroImg = document.getElementById('hero-img');
      heroImg.style.opacity = '0';
      setTimeout(() => {
        heroImg.src = imageSrc;
        heroImg.style.display = 'block';
        heroImg.style.opacity = '1';
      }, 150);
    }

    document.addEventListener('DOMContentLoaded', () => {
      switchBrand('lukia', null);
    });
  </script>
</body>
</html>
